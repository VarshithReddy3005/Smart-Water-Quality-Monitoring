version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aquaguard-postgres
    restart: always
    environment:
      POSTGRES_USER: aquaguard
      POSTGRES_PASSWORD: aquaguard_secure_password
      POSTGRES_DB: aquaguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquaguard -d aquaguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: aquaguard-mqtt-broker
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aquaguard-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://aquaguard:aquaguard_secure_password@postgres:5432/aquaguard_db
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - MQTT_ENABLED=true
      - SIMULATION_ENABLED_DEFAULT=true
      - SECRET_KEY=aquaguard-production-secret-jwt-key-2026
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aquaguard-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
